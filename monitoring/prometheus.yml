global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "tmdb-pipeline"

scrape_configs:
  - job_name: "statsd-exporter"
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
