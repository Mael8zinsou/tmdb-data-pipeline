# Mapping StatsD (Airflow) -> Prometheus
# Réf. métriques Airflow : https://airflow.apache.org/docs/apache-airflow/2.9.1/administration-and-deployment/logging-monitoring/metrics.html

mappings:
  # ─── Durations de DAG runs ──────────────────────────────────────────────────
  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration_success_seconds"
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration_failed_seconds"
    labels:
      dag_id: "$1"

  # ─── Durations de tasks ─────────────────────────────────────────────────────
  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration_seconds"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  - match: "airflow.ti.start.*.*"
    name: "airflow_ti_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  # ─── Compteurs DAG runs ─────────────────────────────────────────────────────
  - match: "airflow.dagrun.dependency-check.*"
    name: "airflow_dagrun_dependency_check_seconds"
    labels:
      dag_id: "$1"

  - match: "airflow.dagrun_succeeded"
    name: "airflow_dagrun_succeeded_total"

  - match: "airflow.dagrun_failed"
    name: "airflow_dagrun_failed_total"

  - match: "airflow.ti_successes"
    name: "airflow_ti_successes_total"

  - match: "airflow.ti_failures"
    name: "airflow_ti_failures_total"

  # ─── Scheduler ──────────────────────────────────────────────────────────────
  # NB : la métrique réelle Airflow 2.9.x est "scheduler_heartbeat" (underscore),
  # pas "scheduler.heartbeat" (dot). C'est un counter incrémenté à chaque tick.
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat"

  - match: "airflow.scheduler.tasks.running"
    name: "airflow_scheduler_tasks_running"

  - match: "airflow.scheduler.tasks.executable"
    name: "airflow_scheduler_tasks_executable"

  - match: "airflow.executor.open_slots"
    name: "airflow_executor_open_slots"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"

  # ─── Fallback : capture tout ce qui n'est pas mappé explicitement ───────────
  - match: "airflow.*"
    name: "airflow_unmapped"
    labels:
      raw_metric: "$1"
